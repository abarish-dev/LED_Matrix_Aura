; ============================================================================
;  Aura Matrix — PlatformIO project for Adafruit MatrixPortal ESP32-S3
;  Drives a 128x64 HUB75 RGB LED matrix.
;
;  Open this folder in VS Code with the PlatformIO extension, then Build/Upload.
; ============================================================================
[env:adafruit_matrixportal_esp32s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200

; PSRAM is required for the HUB75 DMA framebuffer at 128x64.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.15
    adafruit/Adafruit GFX Library @ ^1.11.9
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.1.0
    h2zero/NimBLE-Arduino @ ^1.4.2
